<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Марьяны 💌</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    min-height: 100vh;
    background: #0a0605;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    color: #f5e6d3;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ФОН */
  .bg {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, #2a1218 0%, #0f0a08 60%, #050302 100%);
    z-index: -2;
  }

  /* ЗВЁЗДЫ */
  .stars-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 4s infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.1; }
    50% { opacity: 0.8; }
  }

  .stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: opacity 0.8s ease;
  }
  .stage.hidden { display: none; }

  /* КОНВЕРТ */
  .envelope-wrap {
    perspective: 1400px;
    cursor: pointer;
  }
  .envelope {
    width: 320px;
    height: 210px;
    position: relative;
    transform-style: preserve-3d;
    animation: floatEnv 5s ease-in-out infinite;
  }
  @keyframes floatEnv {
    0%,100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-14px) rotate(1.5deg); }
  }

  .env-body {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #f5e6d3 0%, #e8d5b8 100%);
    border-radius: 10px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.8);
  }

  .env-flap {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 62%;
    background: linear-gradient(180deg, #e8d5b8 0%, #c9a97e 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-radius: 10px 10px 0 0;
    transform-origin: top center;
    transition: transform 1s cubic-bezier(0.6, 0, 0.4, 1);
    z-index: 3;
  }
  .envelope-wrap.opened .env-flap {
    transform: rotateX(180deg);
  }

  .seal {
    position: absolute;
    top: 55%; left: 50%;
    transform: translate(-50%, -50%);
    width: 72px;
    height: 72px;
    background: radial-gradient(circle at 30% 30%, #e63946, #8b0000);
    border-radius: 50%;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f5e6d3;
    font-size: 30px;
    box-shadow: 0 6px 25px rgba(196,30,58,0.8);
    transition: all 0.8s ease;
  }
  .envelope-wrap.opened .seal {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0) rotate(360deg);
  }

  .env-name {
    position: absolute;
    bottom: 24px;
    left: 0; right: 0;
    text-align: center;
    font-size: 26px;
    font-weight: 600;
    color: #5a3a28;
    letter-spacing: 0.5px;
  }

  .hint {
    text-align: center;
    margin-top: 40px;
    font-size: 0.8rem;
    color: #a89080;
    letter-spacing: 3px;
    animation: pulse 2.2s infinite;
    text-transform: uppercase;
  }
  @keyframes pulse {
    0%,100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* ПИСЬМО */
  .paper-wrap {
    max-width: 680px;
    width: 100%;
    margin: 40px auto;
    animation: paperIn 1.2s ease-out;
  }
  @keyframes paperIn {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .paper {
    background: #fbf3e3;
    border-radius: 16px;
    padding: 50px 40px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    color: #1c1c1e;
  }

  .paper-title {
    font-size: 2.2rem;
    font-weight: 700;
    color: #1c1c1e;
    text-align: center;
    margin-bottom: 35px;
    letter-spacing: -0.5px;
    opacity: 0;
    animation: inkIn 1.2s forwards;
  }

  .paper-text {
    font-size: 1.15rem;
    line-height: 1.7;
    white-space: pre-line;
    color: #1c1c1e;
    font-weight: 400;
  }

  .ink-line {
    opacity: 0;
    animation: inkIn 1s forwards;
  }
  @keyframes inkIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .paper-sign {
    font-size: 1.4rem;
    font-weight: 600;
    color: #8b3a3a;
    text-align: right;
    margin-top: 40px;
    opacity: 0;
    animation: inkIn 1.2s 3s forwards;
  }

  /* ФИНАЛ */
  .final {
    text-align: center;
    padding: 40px 20px;
    max-width: 600px;
    margin: 0 auto;
  }
  .final-title {
    font-size: 2.2rem;
    font-weight: 700;
    color: #ff8fa3;
    margin-bottom: 40px;
    opacity: 0;
    animation: inkIn 1.5s forwards;
  }

  .heart-canvas {
    width: 100%;
    max-width: 450px;
    aspect-ratio: 1;
    border-radius: 20px;
    background: #0a0605;
    display: block;
    margin: 0 auto;
    box-shadow: 0 30px 100px rgba(255,77,109,0.3);
  }

  .heart-count {
    margin-top: 30px;
    font-size: 0.95rem;
    color: #ff8fa3;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .actions {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 45px;
  }

  .btn {
    padding: 16px 38px;
    background: linear-gradient(135deg, #c41e3a, #8b0000);
    color: #f5e6d3;
    border: none;
    border-radius: 50px;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 12px 35px rgba(196,30,58,0.5);
  }
  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 45px rgba(196,30,58,0.7);
  }
  .btn.ghost {
    background: transparent;
    border: 2px solid #c41e3a;
    color: #ff8fa3;
    box-shadow: none;
  }

  /* СЕРДЕЧКИ */
  .float-hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    overflow: hidden;
  }
  .fh {
    position: absolute;
    animation: floatUp linear forwards;
    filter: drop-shadow(0 0 6px rgba(255,77,109,0.6));
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-150px) scale(1.3); opacity: 0; }
  }

  @media (max-width: 600px) {
    .paper { padding: 35px 25px; }
    .paper-title { font-size: 1.8rem; }
    .paper-text { font-size: 1.05rem; }
    .final-title { font-size: 1.8rem; }
    .envelope { width: 280px; height: 185px; }
    .env-name { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="stars-bg" id="starsBg"></div>
<div class="float-hearts" id="floatHearts"></div>

<!-- ЭТАП 1: КОНВЕРТ -->
<div class="stage" id="stageEnv">
  <div>
    <div class="envelope-wrap" id="envelopeWrap" onclick="openEnvelope()">
      <div class="envelope">
        <div class="env-body"></div>
        <div class="env-flap"></div>
        <div class="seal">❤</div>
        <div class="env-name">Марьяна</div>
      </div>
    </div>
    <div class="hint">нажми на конверт</div>
  </div>
</div>

<!-- ЭТАП 2: ПИСЬМО -->
<div class="stage hidden" id="stageLetter">
  <div class="paper-wrap">
    <div class="paper">
      <h1 class="paper-title">Марьяна</h1>
      <div class="paper-text" id="letterText"></div>
      <div class="paper-sign">Твой навсегда ❤</div>
    </div>
    <div class="actions">
      <button class="btn" onclick="showFinal()">Дальше 💌</button>
    </div>
  </div>
</div>

<!-- ЭТАП 3: ФИНАЛ -->
<div class="stage hidden" id="stageFinal">
  <div class="final">
    <h1 class="final-title">Марьяна — моё сердце</h1>
    <canvas class="heart-canvas" id="heartCanvas" width="500" height="500"></canvas>
    <div class="heart-count">собрано из <span id="heartCount">0</span> сердечек</div>
    <div class="actions">
      <button class="btn" onclick="saveOpen()">Сохранить себе 💾</button>
      <button class="btn ghost" onclick="location.reload()">Сначала</button>
    </div>
  </div>
</div>

<script>
  /* ТЕКСТ ПИСЬМА */
  const LETTER_LINES = [
    "Марьяна, любимая моя,",
    "",
    "Я пишу это письмо, чтобы сказать тебе то, что, возможно, не всегда говорю вслух.",
    "",
    "Я до сих пор помню тот день, когда мы впервые встретились в Roblox.",
    "Мы были просто соседями по игре. Даже не думали,",
    "что именно на этом сервере начнём общаться.",
    "Не думали, что всё закрутится так, как закрутилось.",
    "И уж точно не думали, что всё у нас будет хорошо.",
    "",
    "Но оно стало. И стало лучше, чем я мог представить.",
    "",
    "Я не думал, что буду любить тебя так сильно.",
    "Не думал, что каждый день буду ждать твоего сообщения,",
    "что твоя улыбка станет для меня самым важным на свете,",
    "а твой голос — самой любимой музыкой.",
    "",
    "Но это случилось. И я счастлив, что это случилось именно с тобой.",
    "",
    "Спасибо тебе за то, что ты всегда рядом.",
    "Даже когда у меня всё хорошо — ты рядом.",
    "Даже когда у меня всё плохо — ты всё равно рядом.",
    "Ты не уходишь. Ты не бросаешь. Ты просто есть.",
    "И это самое дорогое, что у меня есть.",
    "",
    "Бывают дни, когда мне тяжело. Когда всё валится из рук.",
    "И в такие моменты я вспоминаю о тебе — и становится легче.",
    "Потому что ты — моя опора. Моя тихая гавань.",
    "Моё самое тёплое место на земле.",
    "",
    "Я очень рад, что мы встретились.",
    "Я очень рад, что это была именно ты.",
    "Я очень рад, что ты — моя.",
    "",
    "Ты — человек, рядом с которым я хочу быть всегда.",
    "Не на день. Не на год. А на всю жизнь.",
    "",
    "Я люблю тебя. Больше, чем могу выразить словами.",
    "Больше, чем помещается в это письмо."
  ];

  /* ЗВЁЗДЫ */
  const starsBg = document.getElementById('starsBg');
  for (let i = 0; i < 120; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2 + 0.5;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 4 + 's';
    starsBg.appendChild(star);
  }

  /* ОТКРЫТИЕ КОНВЕРТА */
  function openEnvelope() {
    const wrap = document.getElementById('envelopeWrap');
    if (wrap.classList.contains('opened')) return;
    wrap.classList.add('opened');
    burstHearts();
    setTimeout(() => {
      document.getElementById('stageEnv').classList.add('hidden');
      document.getElementById('stageLetter').classList.remove('hidden');
      typeLetter();
      window.scrollTo(0, 0);
    }, 1200);
  }

  /* ПРОЯВЛЕНИЕ ТЕКСТА */
  function typeLetter() {
    const container = document.getElementById('letterText');
    container.innerHTML = '';
    LETTER_LINES.forEach((line, i) => {
      const div = document.createElement('div');
      div.className = 'ink-line';
      div.style.animationDelay = (i * 0.2) + 's';
      div.textContent = line || '\u00A0';
      container.appendChild(div);
    });
  }

  /* ФИНАЛ */
  function showFinal() {
    document.getElementById('stageLetter').classList.add('hidden');
    document.getElementById('stageFinal').classList.remove('hidden');
    burstHearts();
    drawHeartPortrait();
    window.scrollTo(0, 0);
  }

  /* ПОРТРЕТ */
  function drawHeartPortrait() {
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.fillStyle = '#0a0605';
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2, cy = H / 2;
    let count = 0;
    const TOTAL = 8000;
    const colors = ['#ff4d6d', '#ff8fa3', '#c41e3a', '#ffb3c1', '#8b0000', '#ff6b8a'];

    function drawHeart(x, y, size, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, y + size * 0.3);
      ctx.bezierCurveTo(x, y, x - size * 0.5, y, x - size * 0.5, y + size * 0.3);
      ctx.bezierCurveTo(x - size * 0.5, y + size * 0.6, x, y + size * 0.9, x, y + size * 1.1);
      ctx.bezierCurveTo(x, y + size * 0.9, x + size * 0.5, y + size * 0.6, x + size * 0.5, y + size * 0.3);
      ctx.bezierCurveTo(x + size * 0.5, y, x, y, x, y + size * 0.3);
      ctx.fill();
      count++;
    }

    function heartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      return { x: cx + x * (W / 44), y: cy + y * (H / 44) };
    }

    const interval = setInterval(() => {
      for (let i = 0; i < 50; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = heartPoint(t);
        const jitterX = (Math.random() - 0.5) * 38;
        const jitterY = (Math.random() - 0.5) * 38;
        const size = 3 + Math.random() * 5;
        const color = colors[Math.floor(Math.random() * colors.length)];
        drawHeart(p.x + jitterX, p.y + jitterY, size, color);
      }
      document.getElementById('heartCount').textContent = count;
      if (count >= TOTAL) clearInterval(interval);
    }, 25);
  }

  /* ВЗРЫВ СЕРДЕЧЕК */
  function burstHearts() {
    const container = document.getElementById('floatHearts');
    const symbols = ['❤️', '💖', '💕', '💗', '💓', '💘'];
    for (let i = 0; i < 40; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'fh';
        h.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        h.style.left = Math.random() * 100 + '%';
        h.style.fontSize = (Math.random() * 25 + 16) + 'px';
        h.style.animationDuration = (Math.random() * 4 + 5) + 's';
        container.appendChild(h);
        setTimeout(() => h.remove(), 9000);
      }, i * 55);
    }
  }

  /* СОХРАНИТЬ */
  function saveOpen() {
    const canvas = document.getElementById('heartCanvas');
    const link = document.createElement('a');
    link.download = 'для-марьяны.png';
    link.href = canvas.toDataURL();
    link.click();
  }
</script>
</body>
</html>
